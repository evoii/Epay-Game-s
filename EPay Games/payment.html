<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPay Games - Payment</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>EPay Games</h1>
        <nav>
            <ul>
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="product.html" class="nav-link">Products</a></li>
                <li><a href="support.html" class="nav-link">Support</a></li>
                <li><a href="about.html" class="nav-link">About Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Payment</h2>
        <form id="payment-form" class="payment-form">
            <p id="product-details"></p>
            
            <label for="payment-method">Choose Payment Method:</label>
            <select id="payment-method" required>
                <option value="" disabled selected>Select Payment Method</option>
                <option value="paypal">PayPal</option>
                <option value="upi">UPI</option>
            </select>
            
            <div id="paypal-info" class="payment-info">
                <p>PayPal Payment ID: <strong>123456789</strong></p>
            </div>
            
            <div id="upi-info" class="payment-info">
                <p>Scan the QR Code or use the UPI ID below:</p>
                <img src="https://via.placeholder.com/150" alt="UPI QR Code">
                <p>UPI ID: <strong>user@upi</strong></p>
                <label for="upi-app">UPI App Name:</label>
                <input type="text" id="upi-app" required>
                <label for="upi-id">Your UPI ID:</label>
                <input type="text" id="upi-id" required>
            </div>
            
            <button type="submit">Confirm Payment</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2024 EPay Games</p>
    </footer>
    <script src="js/payment.js"></script>
</body>
</html>
